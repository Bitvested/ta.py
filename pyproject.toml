[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ta_py"
version = "1.17.0"
description = "ta.py is a Python package for dealing with financial technical analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nino Kroesen", email = "ninokroesen@gmail.com" }
]
keywords = [
    "financial", "technical", "analysis", "ta", "simple", "weighted",
    "exponential", "sma", "wma", "ema", "aroon", "rsi", "stochastics",
    "macd", "atr", "vwap", "lsma", "least", "squares", "average", "kama",
    "variance", "correlation", "aad", "mad", "ssd", "kmeans", "monte", "carlo"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Bitvested/ta.py"

[tool.setuptools.packages.find]
include = ["ta_py*"]
exclude = ["tests*", "bench*"]
