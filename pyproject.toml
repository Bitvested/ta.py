[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ta_py"
version = "2.1.0"
description = "Fastest zero-dependency pure-Python technical analysis library — full functional parity with ta.js 2.0"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nino Kroesen", email = "ninokroesen@gmail.com" }
]
keywords = [
    # category terms — what people actually search for
    "technical-analysis", "technical-analysis-library", "technical-indicators",
    "trading", "algorithmic-trading", "quantitative-finance", "quant",
    "finance", "financial-analysis", "stock-market", "cryptocurrency",
    "trading-strategies", "backtesting", "fintech",
    # differentiators
    "zero-dependency", "no-dependencies", "pure-python", "numpy-free",
    "pandas-free", "ta-lib-alternative", "pandas-ta-alternative",
    # indicators
    "ta", "sma", "wma", "ema", "rsi", "macd", "atr", "vwap", "adx", "cci",
    "aroon", "stochastics", "bollinger-bands", "kama", "lsma",
    "least-squares", "variance", "correlation", "kmeans", "monte-carlo",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Bitvested/ta.py"
Repository = "https://github.com/Bitvested/ta.py"
Issues = "https://github.com/Bitvested/ta.py/issues"
Changelog = "https://github.com/Bitvested/ta.py/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ta_py*"]
exclude = ["tests*", "bench*"]

[tool.setuptools.package-data]
ta_py = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
