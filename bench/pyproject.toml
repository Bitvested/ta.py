[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ta_py_bench"
version = "0.0.0"
description = "Cross-library benchmark harness for ta.py vs TA-Lib, pandas-ta, finta."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
talib      = ["TA-Lib>=0.4.28"]
pandas-ta  = ["pandas-ta>=0.3.14b", "pandas>=2.0", "numpy>=1.24"]
finta      = ["finta>=1.3", "pandas>=2.0", "numpy>=1.24"]
all        = ["TA-Lib>=0.4.28", "pandas-ta>=0.3.14b", "finta>=1.3", "pandas>=2.0", "numpy>=1.24"]

[tool.setuptools]
py-modules = []
